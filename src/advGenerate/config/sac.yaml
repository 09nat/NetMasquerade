# NetMasquerade stage 2. All relative paths resolve from the repository root.
trainer:
  train_data_pth: traffic_data/fuzzing/malicious_train.pkl
  test_data_pth: traffic_data/fuzzing/malicious_test.pkl

  env_name: NetBeacon
  target_model_pth: outputs/netbeacon/fuzzing.pkl
  bert_pth: pretrained_models/traffic_bert/BERTLM_mawi0611_sizebest.pth
  model_save_pth: outputs/netmasquerade/agent
  report_path: outputs/netmasquerade/reproduction.json

  device: cuda:0
  seed: 512
  episodes: 1000        # SAC training episodes (one flow per episode)
  test_episodes: 100
  batch_size: 64
  buffer_size: 10000
  minimal_size: 200     # replay-buffer warm-up before the first update

  max_stop_step: 5      # exact maximum number of packet edits per flow
  stop_threshold: 0.95  # confidence at which the agent stops on its own when
                        # no detector feedback is available

env:
  bad_ip:               # attacker IP; null -> use the first packet's source IP

model:
  state_dim: 512        # max tokens per flow; action space is 2*state_dim+1
  embedding_dim: 128
  hidden_dim: 128
  actor_lr: 0.00001
  critic_lr: 0.00001
  alpha_lr: 0.00001
  gamma: 0.9
  tau: 0.005            # target-network soft update
  target_entropy: -5
